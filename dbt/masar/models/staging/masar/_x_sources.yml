version: 2

sources:
  - name: raw
    schema: bronze
    tables:
      - name: t
        identifier: trips

  - name: x_fresh
    schema: bronze
    tables:
      - name: trips
        loaded_at_field: _ingested_at
        freshness:
          warn_after: {count: 0, period: minute}
          error_after: {count: 14, period: day}

      - name: drivers
        loaded_at_field: _ingested_at
        freshness:
          warn_after: {count: 0, period: minute}
          error_after: {count: 60, period: day}